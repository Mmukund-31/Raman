# Render Blueprint: one web service runs the API and serves the built website from the same URL.
# Dashboard → New → Blueprint → pick this repository (or create a Web Service by hand with the same commands).
services:
  - type: web
    name: ramanreach
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: "22"
      # Optional: AI-written report summaries. Leave empty to use the built-in template summaries.
      - key: ANTHROPIC_API_KEY
        sync: false
